plugins {
  id 'java'
  id "com.katalon.gradle-plugin" version "0.2.0"
}

repositories {
  mavenCentral()
}

dependencies {
  // sample dependencies
  // rest-assured
  // compile 'io.rest-assured:rest-assured:3.2.0'
  // JsonPath
  // compile 'io.rest-assured:json-path:3.2.0'
  // XmlPath
  // compile 'io.rest-assured:json-path:3.2.0'
  // JSON Schema Validation
  // compile 'io.rest-assured:json-schema-validator:3.2.0'
}

tasks.register("startApi", Exec) {
    workingDir rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) {
        commandLine "powershell", "-Command", "Start-Process node -ArgumentList 'service' -WindowStyle Hidden"
    } else {
        commandLine "sh", "-c", "nohup node service >/dev/null 2>&1 &"
    }
}
